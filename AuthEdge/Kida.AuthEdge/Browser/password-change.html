<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f7f9">
  <title>Change your password</title>
  <link rel="stylesheet" href="{{BROWSER_PREFIX}}/assets/password-change.css">
</head>
<body>
  <main class="shell" data-api-prefix="{{API_PREFIX}}">
    <section class="card" aria-labelledby="page-title">
      <header class="card-head">
        <div class="brand-mark" aria-hidden="true">K</div>
        <p class="eyebrow">Identity</p>
        <h1 id="page-title">Change your password</h1>
        <p class="intro">This password is shared by every application that uses your identity. Changing it signs you out of all existing sessions.</p>
      </header>

      <form id="password-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus spellcheck="false">
        </div>

        <div class="field">
          <label for="current-password">Current password</label>
          <div class="input-wrap">
            <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
            <button type="button" class="reveal" data-target="current-password" aria-label="Show current password" aria-pressed="false"></button>
          </div>
        </div>

        <hr class="divider">

        <div class="field">
          <label for="new-password">New password</label>
          <div class="input-wrap">
            <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="{{MINIMUM_PASSWORD_LENGTH}}" required aria-describedby="password-help">
            <button type="button" class="reveal" data-target="new-password" aria-label="Show new password" aria-pressed="false"></button>
          </div>
          <p id="password-help" class="help">Use at least {{MINIMUM_PASSWORD_LENGTH}} characters.</p>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <div class="input-wrap">
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="{{MINIMUM_PASSWORD_LENGTH}}" required aria-describedby="confirm-help">
            <button type="button" class="reveal" data-target="confirm-password" aria-label="Show confirmation password" aria-pressed="false"></button>
          </div>
          <p id="confirm-help" class="help" role="status" aria-live="polite"></p>
        </div>

        <button type="submit" class="submit">Change password</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <p class="footnote">Return to your application and sign in again once your password is changed.</p>
  </main>
  <script src="{{BROWSER_PREFIX}}/assets/password-change.js" defer></script>
</body>
</html>
